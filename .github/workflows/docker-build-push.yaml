name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    # Skip PRs from forks / external contributors
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Caddy version from Dockerfile
        id: version
        run: echo "CADDY_VERSION=$(grep -oP '(?<=^ARG CADDY_VERSION=).+' Dockerfile)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: polypode/caddy-crowdsec-infomaniak:latest
          build-args: CADDY_VERSION=${{ steps.version.outputs.CADDY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
